# Release del plugin: al push di un tag "vX.Y.Z" crea lo zip pulito (cartella starter-security/) e lo allega alla release.
# Il tag deve coincidere con "Version:" nel file principale del plugin.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Il tag deve coincidere con Version del plugin
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 -E '^[[:space:]]*\*?[[:space:]]*Version:' starter-security.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')"
          if [ "$tag" != "$ver" ]; then
            echo "Il tag $GITHUB_REF_NAME non coincide con Version: $ver in starter-security.php"
            exit 1
          fi

      - name: Crea lo zip pulito
        run: |
          mkdir -p dist-zip/starter-security
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='README.md' --exclude='.DS_Store' \
            --exclude='dist-zip/' --exclude='*.bak*' --exclude='*.orig' --exclude='*.map' --exclude='*.log' \
            ./ dist-zip/starter-security/
          (cd dist-zip && zip -qr starter-security.zip starter-security)

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-zip/starter-security.zip --title "starter-security ${GITHUB_REF_NAME#v}" --generate-notes
